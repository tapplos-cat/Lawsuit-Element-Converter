name: 狐速工具打包-v7版本

on:
  workflow_dispatch: # 允许你手动点击按钮触发打包

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装必要依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller python-docx

    - name: 4. 使用 PyInstaller 进行打包
      run: |
        # 注意：这里的 --name 后面的名字是生成的exe文件名
        # 最后的参数必须是你的文件名：要素式起诉状转换工具_v7.py
        pyinstaller --onefile `
                    --noconsole `
                    --clean `
                    --icon="logo.ico" `
                    --name "狐速-要素式转换工具v7" `
                    "要素式起诉状转换工具_v7.py"

    - name: 5. 上传生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: Fox_Tool_v7_EXE
        path: dist/*.exe
